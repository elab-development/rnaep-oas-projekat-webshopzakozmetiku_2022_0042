name: CI/CD Pipeline

on:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and test user-service
        run: |
          cd services/user-service
          npm install
          npm test

      - name: Install and test order-service
        run: |
          cd services/order-service
          npm install
          npm test

      - name: Install and test catalog-service
        run: |
          cd services/catalog-service
          npm install
          npm test

      - name: Install and test recommendation-service
        run: |
          cd services/recommendation-service
          npm install
          npm test

      - name: Install and test campaign-service
        run: |
          cd services/campaign-service
          npm install
          npm test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest

      - name: Build and push catalog-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/catalog-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/catalog-service:latest

      - name: Build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest

      - name: Build and push recommendation-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/recommendation-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/recommendation-service:latest

      - name: Build and push campaign-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/campaign-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/campaign-service:latest

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest