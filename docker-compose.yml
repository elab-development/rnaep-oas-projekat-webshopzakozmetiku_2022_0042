version: "3.8"

services:
  postgres-user:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  postgres-order:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  postgres-campaign:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: campaigndb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"

  mongodb:
    image: mongo:6-jammy
    ports:
      - "27017:27017"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: on-failure

  user-service:
    build: ./services/user-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres-user
      DB_PORT: 5432
      DB_NAME: userdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: secret_key_333
      KAFKA_BROKER: kafka:9092
    depends_on:
      - postgres-user
      - kafka
    restart: on-failure

  catalog-service:
    build: ./services/catalog-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/catalogdb
      JWT_SECRET: secret_key_333
      KAFKA_BROKER: kafka:9092
    depends_on:
      - mongodb
      - kafka
    restart: on-failure

  order-service:
    build: ./services/order-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres-order
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: secret_key_333
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      KAFKA_BROKER: kafka:9092
    depends_on:
      - postgres-order
      - kafka
    restart: on-failure

  recommendation-service:
    build: ./services/recommendation-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      MONGO_URI: mongodb://mongodb:27017/recommendation-db
      JWT_SECRET: secret_key_333
      KAFKA_BROKER: kafka:9092
    depends_on:
      - mongodb
      - kafka
    restart: on-failure

  campaign-service:
    build: ./services/campaign-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_HOST: postgres-campaign
      DB_PORT: 5432
      DB_NAME: campaigndb
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: secret_key_333
    depends_on:
      - postgres-campaign
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: secret_key_333
      USER_SERVICE_URL: http://user-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:3004
      CAMPAIGN_SERVICE_URL: http://campaign-service:3005
    depends_on:
      - user-service
      - catalog-service
      - order-service
      - recommendation-service
      - campaign-service

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
