version: '3.8'

services:
  postgres-user:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  postgres-order:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  postgres-campaign:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: campaigndb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"

  mongodb:
    image: mongo:6-jammy
    ports:
      - "27017:27017"

  user-service:
    build: ./services/user-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres-user
      DB_PORT: 5432
      DB_NAME: userdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: secret_key_333
    depends_on:
      - postgres-user
    restart: on-failure

  catalog-service:
    build: ./services/catalog-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/catalogdb
      JWT_SECRET: secret_key_333
    depends_on:
      - mongodb
    restart: on-failure

  order-service:
    build: ./services/order-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres-order
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: secret_key_333
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
    depends_on:
      - postgres-order
    restart: on-failure  

  recommendation-service:
    build: ./services/recommendation-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      MONGO_URI: mongodb://mongodb:27017/recommendation-db
      JWT_SECRET: secret_key_333
    depends_on:
      - mongodb

  campaign-service:
    build: ./services/campaign-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_HOST: postgres-campaign
      DB_PORT: 5432
      DB_NAME: campaigndb
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: secret_key_333
    depends_on:
      - postgres-campaign
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: secret_key_333
      USER_SERVICE_URL: http://user-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:3004
      CAMPAIGN_SERVICE_URL: http://campaign-service:3005
    depends_on:
      - user-service
      - catalog-service
      - order-service
      - recommendation-service
      - campaign-service