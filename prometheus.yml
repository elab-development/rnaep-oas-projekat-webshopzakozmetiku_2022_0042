      - targets: ['user-service:3001']

  - job_name: 'catalog-service'
    static_configs:
      - targets: ['catalog-service:3002']

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:3003']

  - job_name: 'recommendation-service'
    static_configs:
      - targets: ['recommendation-service:3004']

  - job_name: 'campaign-service'
    static_configs:
      - targets: ['campaign-service:3005']